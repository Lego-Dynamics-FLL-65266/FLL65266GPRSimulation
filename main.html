<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>GPR Simulator v4 — GPU.js + Three.js</title>
  <script src="assets/three.min.js"></script>
  <script src="assets/gpu-browser.min.js"></script>
  <script defer src="gpr_sim.js"></script>
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <div id="ld">
    <div class="ll">GPR<b style="color:var(--accent2)">SIM</b></div>
    <div class="ls">SFCW B-SCAN SIMULATOR v3</div>
    <div class="lbw">
      <div class="lb" id="lbar"></div>
    </div>
    <div class="lm" id="lmsg">INITIALISING…</div>
  </div>

  <div id="topbar">
    <div class="logo">GPR<b>SIM</b></div>
    <div class="sep"></div>
    <span class="tbl">MODE:</span>
    <select class="tbs" id="msel">
      <option value="general">General</option>
      <option value="focus">Focus</option>
      <option value="extreme">Extreme Focus</option>
    </select>
    <div class="sep"></div>
    <button class="tbb" id="bexp">⬇ EXPORT</button>
    <div class="sep"></div>
    <div class="sdot" id="sdot"></div>
    <span id="stxt">READY</span>
  </div>

  <div id="main">
    <div id="sb">

      <div class="ss">
        <div class="st">DRONE POSITION</div>
        <div class="sr"><label>X along-track (m)</label><span class="sv" id="xv">0.0 m</span></div>
        <input type="range" id="xs" min="0" max="200" value="0" step="1">
        <div class="sr"><label>Z cross-track (m)</label><span class="sv" id="zv">5.0 m</span></div>
        <input type="range" id="zs" min="0" max="200" value="100" step="1">
      </div>

      <div class="ss">
        <div class="st">PROCESSING</div>
        <div class="ckr"><input type="checkbox" id="cdewow" checked><label for="cdewow">Dewow</label></div>
        <div class="ckr"><input type="checkbox" id="cgrid" checked><label for="cgrid">Depth grid</label></div>
      </div>

      <div class="ss">
        <div class="st">OBJECTS</div>
        <div id="ol"></div>
      </div>

      <div class="ss">
        <div class="st">GPR PARAMS</div>
        <div id="gpp"></div>
      </div>

      <div class="ss">
        <div class="st">COLORMAP</div>
        <div class="lbar" id="legbar"></div>
        <div class="llbl"><span>−</span><span>0</span><span>+</span></div>
      </div>

      <div class="ss">
        <div class="st">MEDIUM</div>
        <div id="minfo"></div>
      </div>

    </div>

    <div id="centre">
      <div id="xrul"><canvas id="xrc"></canvas></div>
      <div id="sa">
        <canvas id="bc"></canvas>
        <div id="zrul"><canvas id="zrc"></canvas></div>
        <div id="chh"></div>
        <div id="chv"></div>
        <div id="hi"></div>
        <div id="mm"><canvas id="mmc"></canvas></div>
      </div>
    </div>

    <div id="tp">
      <div id="th">A-SCAN</div>
      <div id="tw2"><canvas id="tc"></canvas></div>
    </div>
  </div>

  <div id="sbar">
    <div class="sbi">TRACES:<span class="sbv" id="sbt">—</span></div>
    <div class="sbi">DT:<span class="sbv" id="sbdt">—</span></div>
    <div class="sbi">FREQ:<span class="sbv" id="sbf">—</span></div>
    <div class="sbi">X:<span class="sbv" id="sbx">—</span></div>
    <div class="sbi">Z-LINE:<span class="sbv" id="sbz">—</span></div>
    <div class="sbi">CURSOR:<span class="sbv" id="sbc">—</span></div>
  </div>
</body>
<script>
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      window.close();
    }
  });
</script>

</html>
